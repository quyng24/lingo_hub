name: CI Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: https://lingo-hub-lime.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pknrudlxndmyyqkdfrvt.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check & Lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Run Next.js Build
        run: npm run build

      - name: Run Game Tests (Word Blaster & Word Island)
        run: npm test

